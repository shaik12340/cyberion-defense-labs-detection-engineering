title: LSASS Memory Access
id: 33333333-3333-4333-8333-333333333333
status: experimental
description: Detects processes accessing the LSASS process.
references:
  - https://attack.mitre.org/techniques/T1003/001/
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 10
    TargetImage|endswith: '\lsass.exe'
  condition: selection
falsepositives:
  - Security software accessing LSASS
level: high
