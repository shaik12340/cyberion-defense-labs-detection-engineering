title: Windows PortProxy Registry Modification
id: eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee
status: experimental
description: Detects modification of Windows PortProxy registry configuration.
references:
  - https://attack.mitre.org/techniques/T1112/
tags:
  - attack.defense_evasion
  - attack.t1112
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID:
      - 12
      - 13
    TargetObject|contains: '\Services\PortProxy\'
  condition: selection
falsepositives:
  - Legitimate network configuration
level: high
