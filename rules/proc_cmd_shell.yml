title: Windows Command Shell Execution
id: 22222222-2222-4222-8222-222222222222
status: experimental
description: Detects Windows command shell execution.
references:
  - https://attack.mitre.org/techniques/T1059/003/
tags:
  - attack.execution
  - attack.t1059.003
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    EventID: 1
    Image|endswith: '\cmd.exe'
  condition: selection
falsepositives:
  - Normal administrative command execution
level: low
