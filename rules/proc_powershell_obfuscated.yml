title: Suspicious PowerShell Obfuscation
id: 11111111-1111-4111-8111-111111111111
status: experimental
description: Detects PowerShell process execution with common obfuscation or encoded-content indicators.
references:
  - https://attack.mitre.org/techniques/T1059/001/
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    EventID: 1
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - 'FromBase64String'
      - 'GzipStream'
      - '-enc'
  condition: selection
falsepositives:
  - Administrative PowerShell scripts using encoded content
level: high
