title: SMB Admin Share Access
id: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
status: experimental
description: Detects access to the Windows IPC$ administrative share.
references:
  - https://attack.mitre.org/techniques/T1021/002/
tags:
  - attack.lateral_movement
  - attack.t1021.002
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5145
    ShareName|contains: 'IPC$'
  condition: selection
falsepositives:
  - Normal Windows administrative traffic
level: medium
